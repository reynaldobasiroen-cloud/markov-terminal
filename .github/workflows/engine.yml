name: Markov Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
           - name: Run engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "URL set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "KEY set: ${{ secrets.SUPABASE_KEY != '' }}"
          node scripts/run-engine.js
